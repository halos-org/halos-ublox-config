name: 'Run Tests'
description: 'Run tests for halos-ublox-config (shellcheck + unit tests)'

runs:
  using: 'composite'
  steps:
    - name: Run shellcheck and unit tests
      # ./run test walks test/test-*.sh, so a new suite is picked up here
      # without a matching edit in this file.
      run: ./run test
      shell: bash
